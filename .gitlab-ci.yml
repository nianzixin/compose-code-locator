# Compose Code Locator CI：仅 studio-v* tag 触发，构建 Studio 插件 zip 并创建 GitLab Release。
# 与 GitHub Actions（.github/workflows/publish.yml 的 studio-release job）双端独立、互不依赖。
stages:
  - build
  - release

build-studio-plugin:
  stage: build
  # 需要具备 JDK 17 + Android SDK 的 runner
  script:
    - ./gradlew --no-daemon :studio-plugin:verifyStudioPluginPackaging -Pcodelocator.studio.useStubs=true
  artifacts:
    paths:
      - studio-plugin/build/distributions/compose-code-locator-*.zip
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^studio-v.*/'

release-studio-plugin:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build-studio-plugin]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^studio-v.*/'
  script:
    # zip 上传到 Generic Package Registry，作为 Release 的下载资产；
    # 变量与 release-cli 同段执行，避免跨段丢失
    - |
      ZIP_NAME="compose-code-locator-${CI_COMMIT_TAG}.zip"
      cp studio-plugin/build/distributions/compose-code-locator-*.zip "$ZIP_NAME"
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/compose-code-locator-studio-plugin/${CI_COMMIT_TAG}/${ZIP_NAME}"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "$ZIP_NAME" "$PACKAGE_URL"
      release-cli create \
        --name "Compose Code Locator Studio ${CI_COMMIT_TAG}" \
        --description "Android Studio 插件安装包。安装方式：Settings → Plugins → Install Plugin from Disk。" \
        --assets "link[{name:=${ZIP_NAME},url:=${PACKAGE_URL}}]"
